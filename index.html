<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="author" content="Kurias0">

  <title>Kurias0 | Official Profile</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 28px; color: #f4f1e9; text-align: center;
      font-family: Inter, Arial, sans-serif;
      background: radial-gradient(ellipse at 50% 35%, #242016 0%, #101010 38%, #060606 78%);
    }
    main {
      width: min(100%, 680px); padding: 58px 34px 46px;
      border: 1px solid rgba(214,189,131,.24); border-radius: 22px;
      background: rgba(12,12,12,.78); box-shadow: 0 24px 90px #000a;
    }
    .eyebrow { color: #d6bd83; letter-spacing: .38em; font-size: 11px; }
    h1 { margin: 20px 0 12px; font-size: clamp(48px, 11vw, 82px); letter-spacing: .12em; color: #e1c991; }
    .line { width: 64px; height: 1px; margin: 24px auto; background: #d6bd83; }
    p { color: #aaa69d; line-height: 1.8; font-size: 16px; margin: 0 auto 30px; max-width: 490px; }
    .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    a, button {
      min-width: 190px; padding: 14px 20px; border-radius: 9px;
      border: 1px solid #bda36d; color: #e6d3a8; background: transparent;
      text-decoration: none; font: inherit; font-size: 14px; cursor: pointer;
      transition: .2s ease;
    }
    a:hover, button:hover { background: #d6bd83; color: #111; transform: translateY(-2px); }
    footer { margin-top: 38px; color: #625f58; font-size: 11px; letter-spacing: .18em; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">OFFICIAL PROFILE</div>
    <h1>Kurias0</h1>
    <div class="line"></div>
    <p>Resmî profil sayfası. YouTube kanalımı ziyaret edebilir veya Discord üzerinden ulaşabilirsin.</p>
    <div class="links">
      <a href="https://www.youtube.com/@Kurias0" target="_blank" rel="noopener noreferrer">YouTube Kanalı</a>
      <a href="https://discord.com/users/283382061534806016" target="_blank" rel="noopener noreferrer">Discord Profilim</a>
    </div>
    <footer>© 2026 KURIAS0</footer>
  </main>
</body>
</html>
